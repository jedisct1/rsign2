[package]
name = "rsign2"
version = "0.6.6"
edition = "2018"
authors = [
    "Frank Denis <github@pureftpd.org>",
    "Daniel Rangel <daniel@rangel.in>",
]
description = "Minisign-compatible command-line tool for Ed25519 file signing, signature verification, and key generation in pure Rust."
license = "MIT"
readme = "README.md"
categories = ["command-line-utilities", "cryptography"]
keywords = ["minisign", "signing", "signatures", "ed25519", "cli"]
repository = "https://github.com/jedisct1/rsign2"

[dependencies]
clap = { version = "4.5.60", features = ["std", "cargo", "wrap_help", "string"] }
minisign = "0.9.0"

[target.'cfg(any(windows, unix))'.dependencies]
dirs = "6.0.0"

[profile.release]
lto = true
panic = "abort"
opt-level = 3
